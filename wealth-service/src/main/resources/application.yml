server:
  port: 8081
  tomcat:
    threads:
      max: 400
    max-connections: 8192

spring:
  cloud:
    nacos:
      config:
        enabled: false
      discovery:
        enabled: false
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/wealth?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_ROOT_PASSWORD:change-me-to-a-strong-password}
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
      connection-timeout: 5000
      idle-timeout: 300000
      max-lifetime: 1200000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:change-me-to-a-strong-password}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 32
          max-idle: 16
          min-idle: 4
  task:
    execution:
      pool:
        core-size: 4
        max-size: 8
        queue-capacity: 100

# JWT 配置（密钥来自 .env 或环境变量）
jwt:
  secret: ${JWT_SECRET:change-me-to-a-random-256-bit-key}
  access-expire: ${JWT_ACCESS_EXPIRE:1800000}
  refresh-expire: ${JWT_REFRESH_EXPIRE:604800000}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

# ========== 业务调度与超时配置 ==========
market:
  simulation:
    interval: 2000        # 行情模拟推送间隔（ms）
  sse:
    timeout: 86400000     # SSE 连接超时（ms，默认 24h）
product:
  sync:
    interval: 120000      # 产品数据同步 ES 间隔（ms）

management:
  endpoints:
    web:
      exposure:
        include: health,info
  tracing:
    sampling:
      probability: 0.1
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
