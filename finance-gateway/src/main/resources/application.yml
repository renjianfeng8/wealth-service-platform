server:
  port: 8080

spring:
  cloud:
    gateway:
      routes:
        # 系统服务（后台权限管理）
        - id: finance-system
          uri: http://localhost:8082
          predicates:
            - Path=/system/**

        # 用户服务
        - id: finance-user
          uri: http://localhost:8088
          predicates:
            - Path=/user/**

        # 产品服务
        - id: finance-product
          uri: http://localhost:8084
          predicates:
            - Path=/product/**

        # 账户服务（自选）
        - id: finance-account
          uri: http://localhost:8086
          predicates:
            - Path=/account/**

        # 交易服务
        - id: finance-trade
          uri: http://localhost:8085
          predicates:
            - Path=/trade/**

        # 消息服务
        - id: finance-message
          uri: http://localhost:8087
          predicates:
            - Path=/message/**

        # 搜索服务
        - id: finance-search
          uri: http://localhost:8089
          predicates:
            - Path=/search/**

      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origin-patterns:
              - "*"
            allowed-headers:
              - "*"
            allowed-methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allow-credentials: true
