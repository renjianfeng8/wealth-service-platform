name: Build, Test & Deploy

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Short SHA
        run: echo "SHA_SHORT=${GITHUB_SHA::8}" >> "$GITHUB_ENV"

      - name: Test
        run: mvn -B test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/**'
          retention-days: 7

      - name: Package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: mvn -B package -DskipTests

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push wealth-gateway image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: ./backend/wealth-gateway
          file: backend/wealth-gateway/Dockerfile
          push: true
          tags: |
            ghcr.io/renjianfeng8/wealth-service-platform/wealth-gateway:latest
            ghcr.io/renjianfeng8/wealth-service-platform/wealth-gateway:${{ env.SHA_SHORT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push wealth-service image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: ./backend/wealth-service
          file: backend/wealth-service/Dockerfile
          push: true
          tags: |
            ghcr.io/renjianfeng8/wealth-service-platform/wealth-service:latest
            ghcr.io/renjianfeng8/wealth-service-platform/wealth-service:${{ env.SHA_SHORT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Short SHA
        run: echo "SHA_SHORT=${GITHUB_SHA::8}" >> "$GITHUB_ENV"

      - name: Install
        run: npm ci
        working-directory: front

      - name: Build
        run: npm run build
        working-directory: front

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push frontend image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: front
          push: true
          tags: |
            ghcr.io/renjianfeng8/wealth-service-platform/wealth-front:latest
            ghcr.io/renjianfeng8/wealth-service-platform/wealth-front:${{ env.SHA_SHORT }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
