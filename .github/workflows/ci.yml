name: Build, Test & Deploy

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile
        run: mvn clean compile

      - name: Test
        run: mvn test -DskipTests=false

      - name: Package
        run: mvn package -DskipTests -Dmaven.test.skip=true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/**'
          retention-days: 7

      - name: Log in to ghcr.io
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          for service in gateway service; do
            echo "=== Building wealth-$service ==="
            docker build -f wealth-$service/Dockerfile \
              -t ghcr.io/renjianfeng8/wealth-service-platform/wealth-$service:latest \
              -t ghcr.io/renjianfeng8/wealth-service-platform/wealth-$service:${GITHUB_SHA::8} \
              wealth-$service
            docker push --all-tags ghcr.io/renjianfeng8/wealth-service-platform/wealth-$service
          done

  frontend-user:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: front-user/package-lock.json

      - name: Install
        run: npm ci
        working-directory: front-user

      - name: Build
        run: npm run build
        working-directory: front-user

      - name: Log in to ghcr.io
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push front-user image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: front-user
          push: true
          tags: |
            ghcr.io/renjianfeng8/wealth-service-platform/wealth-front-user:latest
            ghcr.io/renjianfeng8/wealth-service-platform/wealth-front-user:${{ github.sha }}

  frontend-admin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Install
        run: npm ci
        working-directory: front

      - name: Build
        run: npm run build
        working-directory: front

      - name: Log in to ghcr.io
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push frontend image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: front
          push: true
          tags: |
            ghcr.io/renjianfeng8/wealth-service-platform/wealth-front:latest
            ghcr.io/renjianfeng8/wealth-service-platform/wealth-front:${{ github.sha }}
