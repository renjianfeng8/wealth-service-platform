name: Build & Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # === Backend ===
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build backend jars
        run: mvn package -DskipTests -Dmaven.test.skip=true

      - name: Build & push backend images
        run: |
          for mod in gateway system user product account trade message search; do
            image="${{ env.REGISTRY }}/${{ github.repository }}/finance-${mod}"
            echo "Building $image ..."
            docker build -t "${image}:${{ env.IMAGE_TAG }}" -t "${image}:latest" \
              -f "finance-${mod}/Dockerfile" "finance-${mod}"
            docker push "${image}:${{ env.IMAGE_TAG }}"
            docker push "${image}:latest"
          done

      # === Frontend ===
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: front-user/package-lock.json

      - name: Build frontend
        run: |
          npm ci
          npm run build
        working-directory: front-user

      - name: Build & push frontend image
        run: |
          image="${{ env.REGISTRY }}/${{ github.repository }}/finance-front"
          docker build -t "${image}:${{ env.IMAGE_TAG }}" -t "${image}:latest" \
            -f front-user/Dockerfile front-user
          docker push "${image}:${{ env.IMAGE_TAG }}"
          docker push "${image}:latest"

      # === Deploy ===
      - name: Deploy via SSH
        if: ${{ secrets.DEPLOY_HOST != '' }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            cd /opt/finance
            docker compose pull
            docker compose up -d
            docker system prune -f
