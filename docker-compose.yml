name: finance-platform

x-image-prefix: &image-prefix ghcr.io/renjianfeng8/finance-mid-platform

services:
  # ====================== Infrastructure ======================
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: finance-nacos
    ports:
      - "8848:8848"
      - "9848:9848"
    environment:
      MODE: standalone
    restart: unless-stopped
    networks:
      - finance-net

  mysql:
    image: mysql:8.0.37
    container_name: finance-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: finance
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ./finance-common/src/main/resources/sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - finance-net

  redis:
    image: redis:latest
    container_name: finance-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - finance-net

  rabbitmq:
    image: rabbitmq:3.10-management
    container_name: finance-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: unless-stopped
    networks:
      - finance-net

  elasticsearch:
    image: elasticsearch:8.8.2
    container_name: finance-es
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    restart: unless-stopped
    networks:
      - finance-net

  nginx:
    image: nginx:latest
    container_name: finance-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
    restart: unless-stopped
    networks:
      - finance-net

  # ====================== Backend Services ======================
  gateway:
    image: *image-prefix/finance-gateway:latest
    container_name: finance-gateway
    ports:
      - "8080:8080"
    environment:
      - spring.cloud.nacos.discovery.server-addr=nacos:8848
      - spring.cloud.nacos.config.server-addr=nacos:8848
      - spring.datasource.url=jdbc:mysql://mysql:3306/finance?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
      - spring.datasource.password=${MYSQL_ROOT_PASSWORD}
      - spring.elasticsearch.uris=http://elasticsearch:9200
    depends_on:
      - nacos
      - mysql
    restart: unless-stopped
    networks:
      - finance-net

  system:
    image: *image-prefix/finance-system:latest
    container_name: finance-system
    ports:
      - "8082:8082"
    environment:
      - spring.cloud.nacos.discovery.server-addr=nacos:8848
      - spring.cloud.nacos.config.server-addr=nacos:8848
      - spring.datasource.url=jdbc:mysql://mysql:3306/finance?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
      - spring.datasource.password=${MYSQL_ROOT_PASSWORD}
    depends_on:
      nacos:
        condition: service_started
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - finance-net

  user:
    image: *image-prefix/finance-user:latest
    container_name: finance-user
    ports:
      - "8083:8083"
    environment:
      - spring.cloud.nacos.discovery.server-addr=nacos:8848
      - spring.cloud.nacos.config.server-addr=nacos:8848
      - spring.datasource.url=jdbc:mysql://mysql:3306/finance?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
      - spring.datasource.password=${MYSQL_ROOT_PASSWORD}
    depends_on:
      nacos:
        condition: service_started
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - finance-net

  product:
    image: *image-prefix/finance-product:latest
    container_name: finance-product
    ports:
      - "8084:8084"
    environment:
      - spring.cloud.nacos.discovery.server-addr=nacos:8848
      - spring.cloud.nacos.config.server-addr=nacos:8848
      - spring.datasource.url=jdbc:mysql://mysql:3306/finance?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
      - spring.datasource.password=${MYSQL_ROOT_PASSWORD}
    depends_on:
      nacos:
        condition: service_started
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - finance-net

  account:
    image: *image-prefix/finance-account:latest
    container_name: finance-account
    ports:
      - "8086:8086"
    environment:
      - spring.cloud.nacos.discovery.server-addr=nacos:8848
      - spring.cloud.nacos.config.server-addr=nacos:8848
      - spring.datasource.url=jdbc:mysql://mysql:3306/finance?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
      - spring.datasource.password=${MYSQL_ROOT_PASSWORD}
    depends_on:
      nacos:
        condition: service_started
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - finance-net

  trade:
    image: *image-prefix/finance-trade:latest
    container_name: finance-trade
    ports:
      - "8085:8085"
    environment:
      - spring.cloud.nacos.discovery.server-addr=nacos:8848
      - spring.cloud.nacos.config.server-addr=nacos:8848
      - spring.datasource.url=jdbc:mysql://mysql:3306/finance?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
      - spring.datasource.password=${MYSQL_ROOT_PASSWORD}
    depends_on:
      nacos:
        condition: service_started
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - finance-net

  message:
    image: *image-prefix/finance-message:latest
    container_name: finance-message
    ports:
      - "8087:8087"
    environment:
      - spring.cloud.nacos.discovery.server-addr=nacos:8848
      - spring.cloud.nacos.config.server-addr=nacos:8848
      - spring.datasource.url=jdbc:mysql://mysql:3306/finance?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
      - spring.datasource.password=${MYSQL_ROOT_PASSWORD}
    depends_on:
      nacos:
        condition: service_started
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - finance-net

  search:
    image: *image-prefix/finance-search:latest
    container_name: finance-search
    ports:
      - "8089:8089"
    environment:
      - spring.cloud.nacos.discovery.server-addr=nacos:8848
      - spring.cloud.nacos.config.server-addr=nacos:8848
      - spring.elasticsearch.uris=http://elasticsearch:9200
    depends_on:
      nacos:
        condition: service_started
      elasticsearch:
        condition: service_started
    restart: unless-stopped
    networks:
      - finance-net

  frontend:
    image: *image-prefix/finance-front:latest
    container_name: finance-front
    ports:
      - "3000:80"
    restart: unless-stopped
    networks:
      - finance-net

volumes:
  mysql-data:
  es-data:

networks:
  finance-net:
    driver: bridge
