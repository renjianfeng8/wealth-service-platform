name: wealth-platform

services:
  # ====================== Essential Infrastructure ======================
  mysql:
    image: mysql:8.0.37
    container_name: wealth-mysql
    mem_limit: 512m
    memswap_limit: 768m
    oom_score_adj: -800
    ports:
      - "3307:3306"
    command:
      - "--binlog-expire-logs-seconds=604800"
      - "--max-binlog-size=104857600"
      - "--max-connections=100"
      - "--innodb-buffer-pool-size=256M"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: wealth
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
      MYSQL_ROOT_HOST: "%"
      LANG: C.UTF-8
    volumes:
      - mysql-data:/var/lib/mysql
      - ./wealth-common/src/main/resources/sql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./mysql/conf.d/binlog.cnf:/etc/mysql/conf.d/binlog.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - wealth-net

  redis:
    image: redis:latest
    container_name: wealth-redis
    mem_limit: 96m
    memswap_limit: 128m
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging:
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - wealth-net

  nginx:
    image: nginx:latest
    container_name: wealth-nginx
    mem_limit: 64m
    memswap_limit: 96m
    oom_score_adj: -1000
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging:
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - wealth-net

  # ====================== Backend Services ======================
  gateway:
    image: ghcr.io/renjianfeng8/wealth-service-platform/wealth-gateway:latest
    container_name: wealth-gateway
    mem_limit: 256m
    memswap_limit: 384m
    oom_score_adj: -800
    ports:
      - "8080:8080"
    environment:
      - spring.profiles.active=prod
      - server.port=8080
      - CORS_ALLOWED_ORIGINS=https://rjfwealth.cn
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRE=604800000
      - spring.datasource.url=jdbc:mysql://mysql:3306/wealth?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      - spring.datasource.password=${MYSQL_ROOT_PASSWORD}
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      - SPRING_REDIS_TIMEOUT=2000ms
      - REDIS_HOST=redis
      - SPRING_REDIS_PASSWORD=${REDIS_PASSWORD}
      - management.health.redis.enabled=false
      - management.health.elasticsearch.enabled=false
      - management.health.rabbit.enabled=false
      - spring.cloud.sentinel.transport.dashboard=
      - server.ssl.enabled=false
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      mysql:
        condition: service_healthy
      wealth-service:
        condition: service_started
    restart: unless-stopped
    logging:
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - wealth-net

  wealth-service:
    image: ghcr.io/renjianfeng8/wealth-service-platform/wealth-service:latest
    container_name: wealth-service
    mem_limit: 768m
    memswap_limit: 1024m
    oom_score_adj: -500
    ports:
      - "8081:8081"
    environment:
      - spring.profiles.active=prod
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRE=604800000
      - spring.datasource.url=jdbc:mysql://mysql:3306/wealth?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      - spring.datasource.password=${MYSQL_ROOT_PASSWORD}
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      - SPRING_REDIS_TIMEOUT=2000ms
      - REDIS_HOST=redis
      - SPRING_REDIS_PASSWORD=${REDIS_PASSWORD}
      - management.health.redis.enabled=false
      - management.health.elasticsearch.enabled=false
      - management.health.rabbit.enabled=false
      - spring.cloud.sentinel.transport.dashboard=
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    logging:
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - wealth-net

  frontend:
    image: ghcr.io/renjianfeng8/wealth-service-platform/wealth-front:latest
    container_name: wealth-front
    mem_limit: 48m
    memswap_limit: 64m
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    logging:
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - wealth-net

  front-user:
    image: ghcr.io/renjianfeng8/wealth-service-platform/wealth-front-user:latest
    container_name: wealth-front-user
    mem_limit: 48m
    memswap_limit: 64m
    ports:
      - "3002:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    logging:
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - wealth-net

  front-landing:
    image: ghcr.io/renjianfeng8/wealth-service-platform/wealth-front-landing:latest
    container_name: wealth-front-landing
    mem_limit: 32m
    memswap_limit: 48m
    ports:
      - "3003:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    logging:
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - wealth-net

  mysql-backup:
    image: alpine:latest
    container_name: wealth-mysql-backup
    mem_limit: 32m
    memswap_limit: 48m
    entrypoint: |
      sh -c '
        apk add --no-cache mysql-client mariadb-connector-c >/dev/null 2>&1 &&
        exec /scripts/backup-scheduler.sh
      '
    volumes:
      - ./scripts:/scripts:ro
      - ./backups:/backups
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    logging:
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - wealth-net

  # ====================== Monitoring (non-critical) ======================
  prometheus:
    image: prom/prometheus:latest
    container_name: wealth-prometheus
    mem_limit: 192m
    memswap_limit: 256m
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=14d'
      - '--storage.tsdb.retention.size=1GB'
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    logging:
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - wealth-net

  grafana:
    image: grafana/grafana:latest
    container_name: wealth-grafana
    mem_limit: 128m
    memswap_limit: 192m
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SERVER_ROOT_URL=https://rjfwealth.cn
      - GF_INSTALL_PLUGINS=
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -q -O /dev/null http://localhost:3000/api/health || curl -sf http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      prometheus:
        condition: service_healthy
    restart: unless-stopped
    logging:
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      - wealth-net

volumes:
  mysql-data:
  prometheus-data:
  grafana-data:

networks:
  wealth-net:
    driver: bridge
