name: wealth-platform

x-image-prefix: &image-prefix ghcr.io/renjianfeng8/wealth-service-platform

services:
  # ====================== Infrastructure ======================
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: wealth-nacos
    ports:
      - "8848:8848"
      - "9848:9848"
    environment:
      MODE: standalone
    restart: unless-stopped
    networks:
      - wealth-net

  sentinel-dashboard:
    image: bladex/sentinel-dashboard:latest
    container_name: wealth-sentinel
    ports:
      - "8858:8858"
    restart: unless-stopped
    networks:
      - wealth-net

  mysql:
    image: mysql:8.0.37
    container_name: wealth-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: wealth
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ./wealth-common/src/main/resources/sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - wealth-net

  redis:
    image: redis:latest
    container_name: wealth-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - wealth-net

  rabbitmq:
    image: rabbitmq:3.10-management
    container_name: wealth-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: unless-stopped
    networks:
      - wealth-net

  seata-server:
    image: seataio/seata-server:2.0.0
    container_name: wealth-seata
    ports:
      - "7091:7091"
      - "8091:8091"
    environment:
      - SEATA_IP=seata-server
      - SEATA_PORT=8091
    volumes:
      - ./seata-config/application.yml:/seata-server/resources/application.yml
    depends_on:
      nacos:
        condition: service_started
    restart: unless-stopped
    networks:
      - wealth-net

  elasticsearch:
    image: elasticsearch:8.8.2
    container_name: wealth-es
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    restart: unless-stopped
    networks:
      - wealth-net

  nginx:
    image: nginx:latest
    container_name: wealth-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
    restart: unless-stopped
    networks:
      - wealth-net

  # ====================== Backend Services ======================
  gateway:
    image: *image-prefix/wealth-gateway:latest
    container_name: wealth-gateway
    ports:
      - "8080:8080"
    environment:
      - spring.cloud.nacos.discovery.server-addr=nacos:8848
      - spring.cloud.nacos.config.server-addr=nacos:8848
      - spring.datasource.url=jdbc:mysql://mysql:3306/wealth?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
      - spring.datasource.password=${MYSQL_ROOT_PASSWORD}
      - spring.elasticsearch.uris=http://elasticsearch:9200
    depends_on:
      - nacos
      - mysql
    restart: unless-stopped
    networks:
      - wealth-net

  system:
    image: *image-prefix/wealth-system:latest
    container_name: wealth-system
    ports:
      - "8082:8082"
    environment:
      - spring.cloud.nacos.discovery.server-addr=nacos:8848
      - spring.cloud.nacos.config.server-addr=nacos:8848
      - spring.datasource.url=jdbc:mysql://mysql:3306/wealth?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
      - spring.datasource.password=${MYSQL_ROOT_PASSWORD}
    depends_on:
      nacos:
        condition: service_started
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - wealth-net

  user:
    image: *image-prefix/wealth-user:latest
    container_name: wealth-user
    ports:
      - "8083:8083"
    environment:
      - spring.cloud.nacos.discovery.server-addr=nacos:8848
      - spring.cloud.nacos.config.server-addr=nacos:8848
      - spring.datasource.url=jdbc:mysql://mysql:3306/wealth?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
      - spring.datasource.password=${MYSQL_ROOT_PASSWORD}
    depends_on:
      nacos:
        condition: service_started
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - wealth-net

  product:
    image: *image-prefix/wealth-product:latest
    container_name: wealth-product
    ports:
      - "8084:8084"
    environment:
      - spring.cloud.nacos.discovery.server-addr=nacos:8848
      - spring.cloud.nacos.config.server-addr=nacos:8848
      - spring.datasource.url=jdbc:mysql://mysql:3306/wealth?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
      - spring.datasource.password=${MYSQL_ROOT_PASSWORD}
    depends_on:
      nacos:
        condition: service_started
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - wealth-net

  account:
    image: *image-prefix/wealth-account:latest
    container_name: wealth-account
    ports:
      - "8086:8086"
    environment:
      - spring.cloud.nacos.discovery.server-addr=nacos:8848
      - spring.cloud.nacos.config.server-addr=nacos:8848
      - spring.datasource.url=jdbc:mysql://mysql:3306/wealth?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
      - spring.datasource.password=${MYSQL_ROOT_PASSWORD}
    depends_on:
      nacos:
        condition: service_started
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - wealth-net

  trade:
    image: *image-prefix/wealth-trade:latest
    container_name: wealth-trade
    ports:
      - "8085:8085"
    environment:
      - spring.cloud.nacos.discovery.server-addr=nacos:8848
      - spring.cloud.nacos.config.server-addr=nacos:8848
      - spring.datasource.url=jdbc:mysql://mysql:3306/wealth?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
      - spring.datasource.password=${MYSQL_ROOT_PASSWORD}
    depends_on:
      nacos:
        condition: service_started
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - wealth-net

  message:
    image: *image-prefix/wealth-message:latest
    container_name: wealth-message
    ports:
      - "8087:8087"
    environment:
      - spring.cloud.nacos.discovery.server-addr=nacos:8848
      - spring.cloud.nacos.config.server-addr=nacos:8848
      - spring.datasource.url=jdbc:mysql://mysql:3306/wealth?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
      - spring.datasource.password=${MYSQL_ROOT_PASSWORD}
    depends_on:
      nacos:
        condition: service_started
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - wealth-net

  search:
    image: *image-prefix/wealth-search:latest
    container_name: wealth-search
    ports:
      - "8089:8089"
    environment:
      - spring.cloud.nacos.discovery.server-addr=nacos:8848
      - spring.cloud.nacos.config.server-addr=nacos:8848
      - spring.elasticsearch.uris=http://elasticsearch:9200
    depends_on:
      nacos:
        condition: service_started
      elasticsearch:
        condition: service_started
    restart: unless-stopped
    networks:
      - wealth-net

  frontend:
    image: *image-prefix/wealth-front:latest
    container_name: wealth-front
    ports:
      - "3000:80"
    restart: unless-stopped
    networks:
      - wealth-net

volumes:
  mysql-data:
  es-data:

networks:
  wealth-net:
    driver: bridge
