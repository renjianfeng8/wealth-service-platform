name: wealth-platform

services:
  # ====================== Essential Infrastructure ======================
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: wealth-nacos
    ports:
      - "8848:8848"
      - "9848:9848"
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_IDENTITY_KEY: "nacos"
      NACOS_AUTH_IDENTITY_VALUE: "nacos"
      NACOS_AUTH_TOKEN: "${NACOS_AUTH_TOKEN}"
      JVM_XMS: 256m
      JVM_XMX: 256m
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8848/nacos/v1/console/health/readiness"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - wealth-net

  mysql:
    image: mysql:8.0.37
    container_name: wealth-mysql
    ports:
      - "3307:3306"
    command:
      - "--binlog-expire-logs-seconds=604800"
      - "--max-binlog-size=104857600"
      - "--max-connections=200"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: wealth
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
      MYSQL_ROOT_HOST: "%"
      LANG: C.UTF-8
    volumes:
      - mysql-data:/var/lib/mysql
      - ./wealth-common/src/main/resources/sql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./mysql/conf.d/binlog.cnf:/etc/mysql/conf.d/binlog.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - wealth-net

  redis:
    image: redis:latest
    container_name: wealth-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - wealth-net

  nginx:
    image: nginx:latest
    container_name: wealth-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - wealth-net

  # ====================== Backend Services ======================
  gateway:
    image: ghcr.io/renjianfeng8/wealth-service-platform/wealth-gateway:latest
    container_name: wealth-gateway
    ports:
      - "8080:8080"
    environment:
      - spring.profiles.active=prod
      - CORS_ALLOWED_ORIGINS=https://rjfwealth.cn
      - spring.cloud.nacos.discovery.server-addr=nacos:8848
      - spring.cloud.nacos.config.server-addr=nacos:8848
      - spring.cloud.nacos.username=${NACOS_USERNAME}
      - spring.cloud.nacos.password=${NACOS_PASSWORD}
      - JWT_SECRET=wealth-micro-service-20260501-very-safe-secret-key-123456789
      - JWT_EXPIRE=604800000
      - spring.datasource.url=jdbc:mysql://mysql:3306/wealth?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      - spring.datasource.password=${MYSQL_ROOT_PASSWORD}
      - spring.redis.host=redis
      - spring.redis.timeout=2000ms
      - server.ssl.enabled=false
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      nacos:
        condition: service_healthy
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - wealth-net

  system:
    image: ghcr.io/renjianfeng8/wealth-service-platform/wealth-system:latest
    container_name: wealth-system
    ports:
      - "8082:8082"
    environment:
      - spring.profiles.active=prod
      - spring.application.name=wealth-system
      - spring.cloud.nacos.discovery.server-addr=nacos:8848
      - spring.cloud.nacos.config.server-addr=nacos:8848
      - spring.cloud.nacos.username=${NACOS_USERNAME}
      - spring.cloud.nacos.password=${NACOS_PASSWORD}
      - JWT_SECRET=wealth-micro-service-20260501-very-safe-secret-key-123456789
      - JWT_EXPIRE=604800000
      - spring.datasource.url=jdbc:mysql://mysql:3306/wealth?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      - spring.datasource.password=${MYSQL_ROOT_PASSWORD}
    entrypoint: ["java", "-Xms256m", "-Xmx256m", "-XX:+UseContainerSupport", "-XX:+ExitOnOutOfMemoryError", "-Djava.security.egd=file:/dev/./urandom", "-Dspring.redis.host=redis", "-Dspring.redis.timeout=2000ms", "-jar", "app.jar"]
    depends_on:
      nacos:
        condition: service_started
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8082/system/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - wealth-net

  user:
    image: wealth-user:updated
    container_name: wealth-user
    ports:
      - "8083:8083"
    environment:
      - spring.profiles.active=prod
      - spring.cloud.nacos.discovery.server-addr=nacos:8848
      - spring.cloud.nacos.config.server-addr=nacos:8848
      - spring.cloud.nacos.username=${NACOS_USERNAME}
      - spring.cloud.nacos.password=${NACOS_PASSWORD}
      - JWT_SECRET=wealth-micro-service-20260501-very-safe-secret-key-123456789
      - JWT_EXPIRE=604800000
      - spring.datasource.url=jdbc:mysql://mysql:3306/wealth?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      - spring.datasource.password=${MYSQL_ROOT_PASSWORD}
      - spring.redis.host=redis
      - spring.redis.timeout=2000ms
    depends_on:
      nacos:
        condition: service_started
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8083/user/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - wealth-net

  product:
    image: wealth-product:updated
    container_name: wealth-product
    ports:
      - "8084:8084"
    environment:
      - spring.profiles.active=prod
      - spring.cloud.nacos.discovery.server-addr=nacos:8848
      - spring.cloud.nacos.config.server-addr=nacos:8848
      - spring.cloud.nacos.username=${NACOS_USERNAME}
      - spring.cloud.nacos.password=${NACOS_PASSWORD}
      - JWT_SECRET=wealth-micro-service-20260501-very-safe-secret-key-123456789
      - JWT_EXPIRE=604800000
      - spring.datasource.url=jdbc:mysql://mysql:3306/wealth?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      - spring.datasource.password=${MYSQL_ROOT_PASSWORD}
      - spring.redis.host=redis
      - spring.redis.timeout=2000ms
    depends_on:
      nacos:
        condition: service_started
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8084/product/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - wealth-net

  trade:
    image: wealth-trade:updated
    container_name: wealth-trade
    ports:
      - "8085:8085"
    environment:
      - spring.profiles.active=prod
      - spring.cloud.nacos.discovery.server-addr=nacos:8848
      - spring.cloud.nacos.config.server-addr=nacos:8848
      - spring.cloud.nacos.username=${NACOS_USERNAME}
      - spring.cloud.nacos.password=${NACOS_PASSWORD}
      - JWT_SECRET=wealth-micro-service-20260501-very-safe-secret-key-123456789
      - JWT_EXPIRE=604800000
      - spring.datasource.url=jdbc:mysql://mysql:3306/wealth?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      - spring.datasource.password=${MYSQL_ROOT_PASSWORD}
      - spring.redis.host=redis
      - spring.redis.timeout=2000ms
      - seata.enabled=false
    depends_on:
      nacos:
        condition: service_started
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8085/trade/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - wealth-net

  message:
    image: wealth-message:updated
    container_name: wealth-message
    ports:
      - "8087:8087"
    environment:
      - spring.profiles.active=prod
      - spring.cloud.nacos.discovery.server-addr=nacos:8848
      - spring.cloud.nacos.config.server-addr=nacos:8848
      - spring.cloud.nacos.username=${NACOS_USERNAME}
      - spring.cloud.nacos.password=${NACOS_PASSWORD}
      - JWT_SECRET=wealth-micro-service-20260501-very-safe-secret-key-123456789
      - JWT_EXPIRE=604800000
      - spring.datasource.url=jdbc:mysql://mysql:3306/wealth?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      - spring.datasource.password=${MYSQL_ROOT_PASSWORD}
      - spring.redis.host=redis
      - spring.redis.timeout=2000ms
      - seata.enabled=false
    depends_on:
      nacos:
        condition: service_started
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8087/message/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - wealth-net

  search:
    image: wealth-search:updated
    container_name: wealth-search
    ports:
      - "8089:8089"
    environment:
      - spring.profiles.active=prod
      - spring.cloud.nacos.discovery.server-addr=nacos:8848
      - spring.cloud.nacos.config.server-addr=nacos:8848
      - spring.cloud.nacos.username=${NACOS_USERNAME}
      - spring.cloud.nacos.password=${NACOS_PASSWORD}
      - JWT_SECRET=wealth-micro-service-20260501-very-safe-secret-key-123456789
      - JWT_EXPIRE=604800000
      - spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchDataAutoConfiguration,org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchRepositoriesAutoConfiguration
    depends_on:
      nacos:
        condition: service_started
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8089/search/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - wealth-net

  frontend:
    image: ghcr.io/renjianfeng8/wealth-service-platform/wealth-front:latest
    container_name: wealth-front
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - wealth-net

  front-user:
    image: ghcr.io/renjianfeng8/wealth-service-platform/wealth-front-user:latest
    container_name: wealth-front-user
    ports:
      - "3002:80"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - wealth-net

  # MySQL 定时备份服务
  mysql-backup:
    image: alpine:latest
    container_name: wealth-mysql-backup
    entrypoint: |
      sh -c '
        apk add --no-cache mysql-client mariadb-connector-c >/dev/null 2>&1 &&
        exec /scripts/backup-scheduler.sh
      '
    volumes:
      - ./scripts:/scripts:ro
      - ./backups:/backups
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - wealth-net

volumes:
  mysql-data:

networks:
  wealth-net:
    driver: bridge
