server:
  port: 8080

# JWT 配置（注入到 JwtAuthGlobalFilter）
jwt:
  secret: ${JWT_SECRET:change-me-to-a-random-256-bit-key}
  access-expire: ${JWT_ACCESS_EXPIRE:1800000}
  refresh-expire: ${JWT_REFRESH_EXPIRE:604800000}

spring:
  application:
    name: wealth-gateway
  cloud:
    nacos:
      config:
        enabled: false
      discovery:
        enabled: false
    gateway:
      default-filters:
        - "AddResponseHeader=Content-Security-Policy, default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'self'"
        - "AddResponseHeader=X-Content-Type-Options, nosniff"
        - "AddResponseHeader=X-Frame-Options, DENY"
      routes:
        - id: wealth-system
          uri: http://${SERVICE_HOST:localhost}:8081
          predicates:
            - Path=/system/**

        - id: wealth-user
          uri: http://${SERVICE_HOST:localhost}:8081
          predicates:
            - Path=/user/**

        - id: wealth-product
          uri: http://${SERVICE_HOST:localhost}:8081
          predicates:
            - Path=/product/**

        - id: wealth-trade
          uri: http://${SERVICE_HOST:localhost}:8081
          predicates:
            - Path=/trade/**

        - id: wealth-message
          uri: http://${SERVICE_HOST:localhost}:8081
          predicates:
            - Path=/message/**

        - id: wealth-search
          uri: http://${SERVICE_HOST:localhost}:8081
          predicates:
            - Path=/search/**

      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origin-patterns:
              - "${CORS_ALLOWED_ORIGINS:http://localhost:3000}"
            allowed-headers:
              - "*"
            allowed-methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allow-credentials: true

      httpclient:
        connect-timeout: 5000
        response-timeout: 10s

      sentinel:
        transport:
          dashboard: ${SENTINEL_DASHBOARD:}
        eager: true

# Actuator 端点暴露（监控指标）
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      probability: 0.1
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

# Knife4j 网关文档聚合（静态 URL 模式，无需 Nacos 服务发现）
knife4j:
  gateway:
    enabled: true
    routes:
      - name: 系统权限
        url: /system/v3/api-docs
        order: 1
      - name: 用户服务
        url: /user/v3/api-docs
        order: 2
      - name: 产品行情（含自选）
        url: /product/v3/api-docs
        order: 3
      - name: 交易委托
        url: /trade/v3/api-docs
        order: 4
      - name: 消息推送
        url: /message/v3/api-docs
        order: 5
      - name: 搜索服务
        url: /search/v3/api-docs
        order: 6
