# 生产环境配置覆盖
# 激活方式：spring.profiles.active=prod 或环境变量 SPRING_PROFILES_ACTIVE=prod

server:
  # 生产环境可关闭 Knife4j/Swagger 文档
springdoc:
  api-docs:
    enabled: false

spring:
  cloud:
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:localhost:8858}
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origin-patterns:
              - "${CORS_ALLOWED_ORIGINS:https://yourdomain.com}"
