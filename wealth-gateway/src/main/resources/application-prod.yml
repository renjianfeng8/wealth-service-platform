# ============================================================
# 生产环境配置
# ============================================================
# Nginx 负责外部 443 SSL 终止，Gateway 通过 HTTP 8080 内部通信。
server:
  port: 8080

springdoc:
  api-docs:
    enabled: false

spring:
  redis:
    host: ${REDIS_HOST:redis}
    port: ${REDIS_PORT:6379}
    timeout: ${REDIS_TIMEOUT:2000ms}
  cloud:
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:localhost:8858}
    gateway:
      default-filters:
        - "AddResponseHeader=Content-Security-Policy, default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'self'"
        - "AddResponseHeader=X-Content-Type-Options, nosniff"
        - "AddResponseHeader=X-Frame-Options, DENY"
      httpclient:
        connect-timeout: 5000
        response-timeout: 10s
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origin-patterns:
              - "${CORS_ALLOWED_ORIGINS:https://yourdomain.com}"
