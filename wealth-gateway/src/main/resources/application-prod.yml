# ============================================================
# 生产环境配置
# ============================================================
# Nginx 负责外部 443 SSL 终止，Gateway 通过 HTTP 8080 内部通信。
server:
  port: 8080

springdoc:
  api-docs:
    enabled: false

spring:
  cloud:
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:localhost:8858}
    gateway:
      httpclient:
        connect-timeout: 5000
        response-timeout: 10s
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origin-patterns:
              - "${CORS_ALLOWED_ORIGINS:https://yourdomain.com}"
