# ============================================================
# 生产环境配置 — SSL / HTTPS
# ============================================================
# Nginx 负责外部 443 SSL 终止，Gateway 额外提供 HTTPS 直连
# 端口 8443，供非 Nginx 部署场景或内部直连使用。
# 开发环境（默认 profile）保持 HTTP 8080，使用自签名 ECDSA 证书。
server:
  port: 8443
  ssl:
    enabled: true
    key-store: classpath:ssl/wealth.pfx
    key-store-password: MEtGlVR8mIj5rObSKQTX1Ng0kuHfiFeZ
    key-store-type: PKCS12
    key-alias: 1

springdoc:
  api-docs:
    enabled: false

spring:
  cloud:
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:localhost:8858}
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origin-patterns:
              - "${CORS_ALLOWED_ORIGINS:https://yourdomain.com}"
