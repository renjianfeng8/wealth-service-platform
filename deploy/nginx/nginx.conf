# =============================================================================
# 理财服务平台 - 生产级 Nginx 配置
# 最后审查: 2026-05-26
# 关键原则:
#   1. 所有 proxy_pass 使用 HTTP/1.1 + 连接复用，杜绝端口耗尽
#   2. 显式超时控制，避免默认值导致意外断连
#   3. Docker bridge 网络下容器 IP 在重启间稳定，upstream 块优于变量
#   4. 统一 SPA 在根路径提供，history 模式路由需 try_files 回退
# =============================================================================

# ---- 全局设置 ----
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    # ---- 基础调优 ----
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # ---- 连接超时 ----
    keepalive_timeout 65s;
    keepalive_requests 1000;
    client_header_timeout 20s;
    client_body_timeout 20s;

    # ---- 上游 DNS 解析 (Docker 内置 DNS) ----
    resolver 127.0.0.11 valid=30s ipv6=off;

    # ---- 日志 ----
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" $upstream_addr $upstream_status '
                    '$request_time $upstream_response_time';

    access_log /var/log/nginx/access.log main buffer=32k flush=5s;
    error_log /var/log/nginx/error.log warn;

    # ---- 静态资源缓存 ----
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=static_cache:10m max_size=100m inactive=60m;

    # =====================================================================
    # Upstream 定义
    # =====================================================================
    upstream frontend_upstream {
        server frontend:80 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream gateway_upstream {
        server gateway:8080 max_fails=3 fail_timeout=10s;
        keepalive 128;
    }

    # =====================================================================
    # HTTP → HTTPS 重定向
    # =====================================================================
    server {
        listen 80;
        server_name rjfwealth.cn www.rjfwealth.cn;

        # 健康检查专用端点（nginx:alpine 无 curl，healthcheck 用 wget 命中此处）
        location = /nginx-health {
            access_log off;
            return 200;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # =====================================================================
    # HTTPS 主服务
    # =====================================================================
    server {
        listen 443 ssl;
        server_name rjfwealth.cn www.rjfwealth.cn;

        ssl_certificate     /etc/nginx/ssl/wealth.crt;
        ssl_certificate_key /etc/nginx/ssl/wealth.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # HSTS
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # 通用安全头
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;

        # ============ 统一 SPA（history 模式路由） ============
        location / {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 30s;
            proxy_connect_timeout 10s;
        }

        # ============ 静态资源缓存 ============
        location ~* ^(?!/api/).*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
            proxy_pass http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_cache static_cache;
            proxy_cache_valid 200 24h;
            proxy_cache_use_stale error timeout updating;
            add_header X-Cache-Status $upstream_cache_status;

            # 单一 Cache-Control 头（替换 expires + add_header 双头）
            add_header Cache-Control "public, max-age=604800, immutable";
            # 该 location 定义 add_header 后不再继承 server 级，需补回安全头
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header X-Content-Type-Options nosniff always;
            add_header X-Frame-Options DENY always;
        }

        # ============ API v1 路由 ============
        # Actuator 端点 — 拒绝外网直接访问
        location ~ ^/api/v1/(system|user|product|trade|message|search)/actuator/ {
            return 403;
        }

        # SSE 实时行情
        location ~ ^/api/v1/product/wea-market-data/sse\b {
            rewrite ^/api/v1(/.*) $1 break;
            proxy_pass http://gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400s;
            proxy_connect_timeout 10s;
            proxy_next_upstream error timeout;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 通用 API 路由
        location ~ ^/api/v1/(system|user|product|trade|message|search)/ {
            rewrite ^/api/v1(/.*) $1 break;
            proxy_pass http://gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;

            proxy_next_upstream error timeout http_500 http_502 http_503;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 30s;

            proxy_buffering on;
            proxy_buffer_size 8k;
            proxy_buffers 8 8k;
        }
    }
}
