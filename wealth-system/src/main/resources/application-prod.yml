# 生产环境配置覆盖
# 激活方式：spring.profiles.active=prod

server:
  port: 8082
  servlet:
    context-path: /system

spring:
  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 3
      connection-timeout: 5000
      max-lifetime: 600000
      idle-timeout: 300000
  redis:
    host: ${REDIS_HOST:redis}
    port: ${REDIS_PORT:6379}
    timeout: ${REDIS_TIMEOUT:2000ms}

springdoc:
  api-docs:
    enabled: false
