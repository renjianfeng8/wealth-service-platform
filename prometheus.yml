# Prometheus 监控配置
# 所有业务指标由 wealth-service 通过不同 context-path 暴露
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'wealth-gateway'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['wealth-gateway:8080']
        labels:
          service: wealth-gateway

  - job_name: 'wealth-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['wealth-service:8081']
        labels:
          service: wealth-service
